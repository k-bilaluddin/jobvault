<!DOCTYPE html>
<html>
<head><style>body{margin:0;padding:40px;background:#1e1e2e;display:flex;justify-content:center;}</style></head>
<body>
<svg viewBox="0 0 720 520" width="720" height="520" xmlns="http://www.w3.org/2000/svg">
  <style>
    .box { fill: #1e1e2e; stroke: #3b3b4f; stroke-width: 1.5; rx: 10; }
    .box-accent { fill: #1a3a5c; stroke: #4a9eff; stroke-width: 1.5; rx: 10; }
    .box-done { fill: #0d2818; stroke: #22c55e; stroke-width: 1.5; rx: 10; }
    .label { font-family: system-ui; font-size: 13px; fill: #e0e0e0; text-anchor: middle; dominant-baseline: central; font-weight: 600; }
    .sublabel { font-family: system-ui; font-size: 10px; fill: #a0a0b0; text-anchor: middle; dominant-baseline: central; }
    .arrow { stroke: #a0a0b0; stroke-width: 1.5; fill: none; marker-end: url(#ah); }
    .arrow-accent { stroke: #4a9eff; stroke-width: 1.5; fill: none; marker-end: url(#aha); }
    .step-num { font-family: system-ui; font-size: 10px; fill: #4a9eff; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
    .note { font-family: system-ui; font-size: 9px; fill: #a0a0b0; text-anchor: middle; dominant-baseline: central; font-style: italic; }
  </style>
  <defs>
    <marker id="ah" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#a0a0b0" stroke-width="1.2"/></marker>
    <marker id="aha" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto"><path d="M0,0 L8,3 L0,6" fill="none" stroke="#4a9eff" stroke-width="1.2"/></marker>
  </defs>
  <rect class="box-accent" x="260" y="20" width="200" height="52"/>
  <text class="label" x="360" y="40">Add Job URLs</text>
  <text class="sublabel" x="360" y="56">Dashboard / Job Queue page</text>
  <text class="step-num" x="245" y="46">①</text>
  <line class="arrow" x1="360" y1="72" x2="360" y2="108"/>
  <rect class="box" x="260" y="110" width="200" height="52"/>
  <text class="label" x="360" y="130">MongoDB</text>
  <text class="sublabel" x="360" y="146">pending_jobs collection</text>
  <text class="step-num" x="245" y="136">②</text>
  <rect class="box-accent" x="30" y="200" width="220" height="52"/>
  <text class="label" x="140" y="220">Claude Routine</text>
  <text class="sublabel" x="140" y="236">Scheduled, polls for pending</text>
  <text class="step-num" x="15" y="226">③</text>
  <path class="arrow-accent" d="M 200 200 Q 200 136, 260 136"/>
  <text class="note" x="170" y="165">GET /queue/pending</text>
  <line class="arrow-accent" x1="140" y1="252" x2="140" y2="298"/>
  <text class="note" x="200" y="275">Feeds URL to agent</text>
  <rect class="box-accent" x="30" y="300" width="300" height="52"/>
  <text class="label" x="180" y="320">Claude Agent</text>
  <text class="sublabel" x="180" y="336">Evaluates JD → picks bullets → builds payload</text>
  <text class="step-num" x="15" y="326">④</text>
  <path class="arrow" d="M 330 326 Q 420 326, 420 378"/>
  <text class="note" x="440" y="350">POST /ingest/applications + jobId</text>
  <rect class="box" x="280" y="380" width="280" height="52"/>
  <text class="label" x="420" y="400">JobVault</text>
  <text class="sublabel" x="420" y="416">Worker → DOCX → PDF → GitHub vault</text>
  <text class="step-num" x="265" y="406">⑤</text>
  <line class="arrow" x1="420" y1="432" x2="420" y2="468"/>
  <rect class="box-done" x="270" y="470" width="300" height="40"/>
  <text class="label" x="420" y="484" style="fill: #22c55e; font-size: 11px;">Job marked done · Dashboard · Telegram</text>
  <rect x="545" y="28" width="65" height="20" rx="4" fill="#4a9eff" opacity="0.15"/>
  <text class="sublabel" x="577" y="38" style="fill: #4a9eff; font-weight: 600; font-size: 9px;">MANUAL</text>
  <rect x="545" y="208" width="85" height="20" rx="4" fill="#22c55e" opacity="0.15"/>
  <text class="sublabel" x="587" y="218" style="fill: #22c55e; font-weight: 600; font-size: 9px;">AUTOMATED</text>
  <line x1="587" y1="228" x2="587" y2="490" stroke="#22c55e" stroke-width="1" stroke-dasharray="4,3" opacity="0.4"/>
</svg>
</body>
</html>
